---
- name: Ensure loki directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ loki_data_dir }}"
    - "{{ loki_compose_dir }}"
    - "{{ loki_config_dir }}"

- name: Render loki config
  template:
    src: loki.yml.j2
    dest: "{{ loki_config_dir }}/loki.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart loki

- name: Render docker compose file for loki
  template:
    src: docker-compose.j2
    dest: "{{ loki_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart loki

- name: Start loki via docker compose v2
  community.docker.docker_compose_v2:
    project_src: "{{ loki_compose_dir }}"
    state: present
