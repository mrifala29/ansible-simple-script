- name: Create ClickHouse directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ clickhouse_data_dir }}"
    - "{{ clickhouse_config_dir }}"

- name: Copy docker-compose file
  template:
    src: docker-compose.yml
    dest: /opt/clickhouse/docker-compose.yml

- name: Run ClickHouse container
  command: docker compose up -d
  args:
    chdir: /opt/clickhouse