---
- name: Ensure ClickHouse directories are present
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ clickhouse_compose_dir }}"
    - "{{ clickhouse_data_dir }}"
    - "{{ clickhouse_config_dir }}"

- name: Deploy ClickHouse docker-compose
  ansible.builtin.template:
    src: docker-compose.yml
    dest: "{{ clickhouse_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart clickhouse

- name:clickhouse_container_name: clickhouse
clickhouse_image: clickhouse/clickhouse-server:latest
clickhouse_ports:
  - "812diclickhouse_image: clickhouse/clickhoruclickhouse_ports:
  - "8123:8123"
  - "9000:9000"

