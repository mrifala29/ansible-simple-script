-   - "9000:9000cl
clickhouse_damunclickhouse_config_dir: /opt/clickhouse/ct_clickhouse_compose_dir: /opt/clickhouse
clice:clickhouse_restart_policy: unless-stop: EOF

cat > roles/databases/clickhouse/tasecaemplates/docker-compose.yml <<'EOF'
version: "3.8"

services:
  clickhouse:
    image: {{ clickhouse_image }}
    container_name: {{ clickhouse_container_name }}
    restart: {{ clickhouse_restart_policy }}

    ports:
      {% for port in clickhouse_ports %}
      - "{{ port }}"
      {% endfor %}

    volumes:
      - {{ clickhouse_data_dir }}:/var/lib/clickhouse
      - {{ clickhouse_config_dir }}:/etc/clickhouse-server

    ulimits:
      nofile:
        soft: 262144
        hard: 262144
