- name: Install dependencies
  apt:
    name:
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Add YugabyteDB GPG key
  apt_key:
    url: https://downloads.yugabyte.com/apt/yugabyte-key.gpg
    state: present

- name: Add YugabyteDB APT repository
  apt_repository:
    repo: "deb https://downloads.yugabyte.com/apt {{ ansible_distribution_release }} main"
    state: present
    filename: yugabyte

- name: Install YugabyteDB
  apt:
    name: yugabyte
    state: present
    update_cache: yes

- name: Create data directory
  file:
    path: "{{ yugabytedb_data_dir }}"
    state: directory
    owner: yugabyte
    group: yugabyte
    mode: "0755"

- name: Install systemd service
  template:
    src: yugabytedb.service.j2
    dest: /etc/systemd/system/yugabytedb.service
    mode: "0644"
  notify: restart yugabytedb

- name: Enable and start YugabyteDB
  systemd:
    name: yugabytedb
    enabled: yes
    state: started