- name: Install dependencies
  apt:
    name:
      - docker.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ yugabytedb_data_dir }}"
    - "{{ yugabytedb_conf_dir }}"

- name: Generate yugabytedb config
  template:
    src: yugabytedb.conf.j2
    dest: "{{ yugabytedb_conf_dir }}/yugabytedb.conf"
  notify: restart yugabytedb

- name: Generate docker-compose.yml
  template:
    src: docker-compose.j2
    dest: "{{ docker_compose_path }}"
  notify: restart yugabytedb

- name: Start YugabyteDB
  command: docker compose -f {{ docker_compose_path }} up -d