---
# Default variables for apps/paperclip
paperclip:
  name: paperclip
  image: "ghcr.io/example/paperclip:latest"
  container_name: "paperclip"
  ports:
    - "3111:3000"
  env:
    STORAGE_BACKEND: "s3"
    MAX_UPLOAD_SIZE: "20M"
    LOG_LEVEL: "info"
  restart: "always"
  volumes: []
  compose_dir: "/opt/paperclip"
