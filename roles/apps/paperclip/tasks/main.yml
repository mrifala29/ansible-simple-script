---
# Tasks to deploy paperclip via docker-compose
- name: Ensure docker-compose directory exists
  ansible.builtin.file:
    path: "{{ paperclip.compose_dir }}"
    state: directory
    mode: "0755"

- name: Render docker-compose for paperclip
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ paperclip.compose_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Restart paperclip

- name: Deploy paperclip with docker compose
  become: true
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ paperclip.compose_dir }}"
  when: not ansible_check_mode
