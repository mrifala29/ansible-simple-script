---
# Default variables for platforms/llm-broker
llm_broker:
  name: llm-broker
  image: "ghcr.io/example/llm-broker:latest"
  container_name: "llm-broker"
  ports:
    - "8080:8080"
  env:
    DB_URL: "postgresql://llm_broker:password@localhost:5432/llm_broker"
    AUTH_PROVIDERS: "openai"
    LOG_LEVEL: "info"
  restart: "always"
  volumes: []
  compose_dir: "/opt/llm-broker"
