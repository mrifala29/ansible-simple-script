- name: Create openmetadata directory
  file:
    path: "{{ openmetadata_dir }}"
    state: directory
    mode: "0755"

- name: Copy OpenMetadata config
  copy:
    src: conf/
    dest: "{{ openmetadata_dir }}/conf/"
    mode: "0644"

- name: Deploy docker-compose
  template:
    src: docker-compose.j2
    dest: "{{ openmetadata_dir }}/docker-compose.yml"

- name: Start OpenMetadata
  community.docker.docker_compose_v2:
    project_src: "{{ openmetadata_dir }}"
    state: present