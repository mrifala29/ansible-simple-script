---
- name: Create Temporal base directory
  file:
    path: "{{ temporal_base_dir }}"
    state: directory
    mode: '0755'
  tags: temporal

- name: Deploy Temporal docker-compose
  template:
    src: docker-compose.yml
    dest: "{{ temporal_base_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Restart Temporal
  tags: temporal

- name: Start Temporal stack
  command: docker compose up -d
  args:
    chdir: "{{ temporal_base_dir }}"
  tags: temporal

- name: Wait for Temporal gRPC to be ready
  wait_for:
    host: "{{ ansible_host }}"
    port: "{{ temporal_grpc_port }}"
    delay: 10
    timeout: 180
  tags: temporal

- name: Wait for Temporal UI to be ready
  wait_for:
    host: "{{ ansible_host }}"
    port: "{{ temporal_ui_port }}"
    delay: 5
    timeout: 120
  tags: temporal
